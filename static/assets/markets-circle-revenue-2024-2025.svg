<svg xmlns='http://www.w3.org/2000/svg' width='1000' height='500' viewBox='0 0 1000 500'>
  <rect width='100%' height='100%' fill='#ffffff'/>
  <style>
    .axis { stroke: #ddd; stroke-width:1 }
    .line { fill:none; stroke:#ff7f50; stroke-width:4 }
    .label { font-family: Arial, sans-serif; fill:#222; font-size:16px }
    .val { font-family: Arial, sans-serif; fill:#222; font-size:16px; font-weight:700; paint-order: stroke; stroke:#fff; stroke-width:6 }
  </style>
  <!-- axes -->
  <line x1='80' y1='420' x2='920' y2='420' class='axis'/>
  <line x1='80' y1='420' x2='80' y2='60' class='axis'/>
  <!-- ticks & labels -->
  <!-- x-axis labels aligned with points -->
  <text x='300' y='455' class='label' text-anchor='middle'>2024.4Q</text>
  <text x='500' y='455' class='label' text-anchor='middle'>2025.4Q</text>
  <text x='40' y='90' class='label'>1000</text>
  <text x='40' y='255' class='label'>500</text>
  <text x='40' y='420' class='label'>0</text>
  <!-- line points scaled to max=1000: y = 420 - (value/1000)*320 -->
  <!-- computed: 435 -> y = 420 - 139.2 ~= 281 ; 770 -> y = 420 - 246.4 ~= 174 -->
  <!-- compress x-range further and center: use x positions 300 and 500 -->
  <polyline points='300,281 500,174' class='line' />
  <!-- points (compressed x-range) -->
  <circle cx='300' cy='281' r='7' fill='#ff7f50' stroke='#fff' stroke-width='2'/>
  <circle cx='500' cy='174' r='7' fill='#ff7f50' stroke='#fff' stroke-width='2'/>
  <!-- value labels (shifted and with white stroke for contrast) -->
  <text x='315' y='265' class='val'>435</text>
  <text x='515' y='158' class='val'>770</text>
  <!-- title -->
  <text x='120' y='40' class='label' style='font-size:18px;font-weight:700'>서클(Circle) 분기 매출 성장 추이 (백만 달러)</text>
</svg>