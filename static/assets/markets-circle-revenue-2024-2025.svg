<svg xmlns='http://www.w3.org/2000/svg' width='800' height='400' viewBox='0 0 800 400'>
  <rect width='100%' height='100%' fill='#ffffff'/>
  <style>
    .axis { stroke: #ccc; stroke-width:1 }
    .line { fill:none; stroke:#ff7f50; stroke-width:3 }
    .label { font-family: Arial, sans-serif; fill:#222; font-size:14px }
  </style>
  <!-- axes -->
  <line x1='70' y1='340' x2='730' y2='340' class='axis'/>
  <line x1='70' y1='340' x2='70' y2='40' class='axis'/>
  <!-- ticks & labels -->
  <text x='70' y='360' class='label'>2024.4Q</text>
  <text x='400' y='360' class='label'>2025.4Q</text>
  <text x='720' y='360' class='label'> </text>
  <text x='30' y='60' class='label'>1000</text>
  <text x='30' y='200' class='label'>500</text>
  <text x='30' y='340' class='label'>0</text>
  <!-- line points scaled to max=1000: y = 340 - (value/1000)*300 -->
  <!-- computed: 435 -> y ~210 ; 770 -> y ~109 -->
  <!-- compress x-range further: use x positions 200 and 300 -->
  <polyline points='200,210 300,109' class='line' />
  <!-- points (compressed x-range) -->
  <circle cx='200' cy='210' r='5' fill='#ff7f50'/>
  <circle cx='300' cy='109' r='5' fill='#ff7f50'/>
  <!-- value labels (shifted and slightly offset up to avoid overlap) -->
  <text x='210' y='200' class='label' style='font-weight:600'>435</text>
  <text x='310' y='99' class='label' style='font-weight:600'>770</text>
  <!-- title -->
  <text x='100' y='30' class='label' style='font-size:16px;font-weight:600'>서클(Circle) 분기 매출 성장 추이 (백만 달러)</text>
</svg>